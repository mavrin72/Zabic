<title>Жабік-Стрибун</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@500;800;900&family=Nunito:wght@400;700&display=swap">
<style>
:root{
  --ink:#150E27; --grape:#241640; --panel:#2E1D4D; --line:#4B2E82;
  --cream:#FFF3DA; --lilac:#BFA3E6; --sun:#FFC93C; --lagoon:#2AB7E6; --leaf:#5FD06A;
  --pixel:"Press Start 2P","Courier New",monospace;
  --display:"Rubik","Trebuchet MS",sans-serif;
  --body:"Nunito","Trebuchet MS",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{
  background:var(--ink);color:var(--cream);font-family:var(--body);
  overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
}
/* полотно — центр екрана, решту заповнює корпус */
#screen{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
  image-rendering:pixelated;display:block;background:#3FB8F0}

/* кутові чіпи: звук і повний екран */
#chips{position:fixed;z-index:6;display:flex;gap:.4rem;
  top:calc(env(safe-area-inset-top,0px) + .55rem);
  right:calc(env(safe-area-inset-right,0px) + .55rem);
  transition:opacity .4s}
#chips.idle{opacity:.16}
.chip{font-family:var(--pixel);font-size:.5rem;line-height:1;color:var(--lilac);
  background:rgba(36,22,64,.82);border:2px solid var(--line);border-bottom-width:4px;
  border-radius:6px;padding:.5rem .55rem;cursor:pointer;min-width:2.1rem;text-align:center}
.chip:active{transform:translateY(2px);border-bottom-width:2px}
.chip:focus-visible{outline:3px solid var(--lagoon);outline-offset:2px}

/* екрани поверх гри */
#overlay{position:fixed;inset:0;z-index:5;display:flex;align-items:center;
  justify-content:center;overflow-y:auto;background:rgba(21,14,39,.92);
  padding:calc(env(safe-area-inset-top,0px) + 1rem) 1rem calc(env(safe-area-inset-bottom,0px) + 1rem)}
#overlay[hidden]{display:none}
.sheet{width:min(30rem,100%);display:flex;flex-direction:column;align-items:center;
  gap:.85rem;text-align:center}
.mascot{width:72px;height:90px;image-rendering:pixelated;
  filter:drop-shadow(0 6px 0 rgba(0,0,0,.35))}
.eyebrow{font-family:var(--pixel);font-size:.5rem;letter-spacing:.14em;color:var(--sun);margin:0}
h1{font-family:var(--display);font-weight:900;margin:0;line-height:.95;
  font-size:clamp(1.9rem,8vw,3rem);letter-spacing:-.02em;text-wrap:balance}
h1 em{font-style:normal;color:var(--lagoon)}
h2{font-family:var(--display);font-weight:900;margin:0;
  font-size:clamp(1.4rem,6vw,2.1rem);line-height:1.05;text-wrap:balance}
.sheet p{margin:0;font-size:.95rem;line-height:1.55;color:var(--lilac);max-width:26rem}
.tally{font-family:var(--pixel);font-size:.66rem;color:var(--sun);letter-spacing:.06em;
  line-height:1.9}
/* легенда керування */
.legend{display:grid;gap:.45rem;width:100%;max-width:23rem;margin:.2rem 0 .1rem}
.row{display:flex;align-items:center;gap:.6rem;justify-content:flex-start;
  background:rgba(46,29,77,.55);border-left:3px solid var(--line);
  padding:.5rem .7rem;text-align:left}
.row .what{font-size:.86rem;color:var(--cream);flex:1}
.row .how{font-family:var(--pixel);font-size:.5rem;color:var(--lilac);
  letter-spacing:.04em;text-align:right;line-height:1.7}
kbd{font-family:var(--pixel);font-size:.5rem;color:var(--cream);background:var(--grape);
  border:2px solid var(--line);border-bottom-width:4px;border-radius:5px;
  padding:.3rem .38rem;display:inline-block}
button.go{font-family:var(--pixel);font-size:.72rem;color:var(--ink);background:var(--sun);
  border:0;border-bottom:5px solid #B98600;border-radius:7px;padding:1rem 1.7rem;
  cursor:pointer;letter-spacing:.04em;margin-top:.3rem}
button.go:active{transform:translateY(3px);border-bottom-width:2px}
button.go:focus-visible{outline:3px solid var(--lagoon);outline-offset:3px}
.rotate{font-size:.82rem;color:var(--sun);margin:0;display:none}
.portrait .rotate{display:block}
footer{font-size:.74rem;color:#7C689E;margin:.2rem 0 0}
/* підказка про зони жестів — з'являється на кілька секунд після старту */
#hint{position:fixed;inset:auto 0 0 0;top:0;z-index:4;display:none;pointer-events:none;
  opacity:0;transition:opacity .5s}
#hint.on{display:flex;opacity:1}
#hint div{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;
  font-family:var(--pixel);font-size:.5rem;line-height:1.9;color:rgba(255,243,218,.92);
  text-shadow:0 2px 0 rgba(21,16,48,.9)}
#hint div+div{border-left:2px dashed rgba(255,243,218,.35)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<canvas id="screen" width="320" height="192" aria-label="Жабік-Стрибун"></canvas>
<div id="chips">
  <button class="chip" id="mute" type="button" title="Звук">ЗВУК</button>
  <button class="chip" id="full" type="button" title="Повний екран">[ ]</button>
</div>

  <div>&#9664; &nbsp;ВЕСТИ ПАЛЬЦЕМ&nbsp; &#9654;</div>
  <div>ТОРКНУТИСЬ =<br>СТРИБОК</div>
</div>
<div id="overlay"></div>

<script>
"use strict";
/* ============================================================
   ЖАБІК-СТРИБУН — піксельний платформер в одному файлі.
   Полотно — «художні» пікселі, збільшені цілим кроком під екран.
   ============================================================ */

const TILE = 16, COLS = 208, ROWS = 16;
const WORLD_W = COLS * TILE, WORLD_H = ROWS * TILE;
let VW = 320, VH = 192, SCALE = 2;      /* видима область у пікселях + крок */

/* ---------- малювання спрайтів з піксельних мап ---------- */
function sprite(rows, pal){
  const w = rows[0].length, h = rows.length;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  for (let y = 0; y < h; y++){
    const line = rows[y];
    for (let x = 0; x < w; x++){
      const ch = line[x];
      if (ch === '.') continue;
      g.fillStyle = pal[ch];
      g.fillRect(x, y, 1, 1);
    }
  }
  return c;
}

/* ---------- Жабік: 16x20, вигляд анфас ---------- */
const FROG_PAL = {
  K:'#2A1B3D', P:'#A97BD1', p:'#7E4FA8', W:'#FFFFFF', E:'#1A1030',
  B:'#22A6DE', b:'#1580B0', Y:'#FFD23F', J:'#4E6FA8', j:'#3B5687'
};
function frogBody(dir){                       // dir: 1 праворуч, -1 ліворуч
  const eye = dir > 0 ? 'WWE' : 'EWW';
  const eyes = '..K' + eye + 'K.K' + eye + 'K...';
  return [
    '...KKK...KKK....',
    eyes,
    eyes,
    '..KPPPKKKPPPK...',
    '..KPpPPPPPpPK...',
    '..KPPPPPPPPPK...',
    '..KPPPPPPPPPK...',
    '..KPKKKKKKKPK...',
    '...KPPPPPPPK....',
    '....KPPPPPK.....',
    '.KKBBBBBBBBBKK..',
    '.KBBBBBYBBBBBK..',
    '.KBBBBYYYBBBBK..',
    '.KBBBBBYBBBBBK..',
    '.KBBBBBBBBBBBK..',
    '.KPKBBBBBBBKPK..'
  ];
}
/* Ноги. Ступні завжди лишаються під тілом — ліва в колонках 2..7,
   права в 8..13. Крок міняє тільки висоту ступні, тому цикл читається
   як перебирання лапами, а не як розліт ніг урізнобіч. */
const LEGS = {
  stand: ['...KJJJKKJJJK...','...KJJJKKJJJK...','...KJjJKKJjJK...','..KKPPKKKKPPKK..'],
  stepL: ['...KJJJKKJJJK...','...KJJJKKJJJK...','..KKPPKKKJjJK...','........KKPPKK..'],
  stepR: ['...KJJJKKJJJK...','...KJJJKKJJJK...','...KJjJKKKPPKK..','..KKPPKK........'],
  jump:  ['...KJJJKKJJJK...','...KJJJKKJJJK...','..KKPPKKKKPPKK..','................']
};
const RUN_CYCLE = ['stepL', 'stand', 'stepR', 'stand'];
const FROG = {};
for (const dir of [1, -1]){
  for (const pose in LEGS){
    FROG[pose + (dir > 0 ? 'R' : 'L')] = sprite(frogBody(dir).concat(LEGS[pose]), FROG_PAL);
  }
}

/* ---------- жук: 14x10 ---------- */
const BUG = sprite([
  '...OOOOOOOO...',
  '..ORRRRRRRRO..',
  '.ORRWERREWRRO.',
  '.ORRRRRRRRRRO.',
  'ORRrRRrRRrRRRO',
  'ORRRRRRRRRRRRO',
  '.ORRRRRRRRRRO.',
  '..OOOOOOOOOO..',
  '..O.OO..OO.O..',
  '.OO..O..O..OO.'
], { O:'#2A1B3D', R:'#E4573D', r:'#B8382A', W:'#FFF7E4', E:'#2A1B3D' });

/* ---------- оса: 12x10, два кадри крил ---------- */
const WASP_PAL = { W:'#DFF3FF', K:'#2A1B3D', Y:'#FFC93C', S:'#6B4A12', E:'#2A1B3D' };
const WASP = [
  sprite([
    '.WW......WW.','WWWW....WWWW','.WW.KKKK.WW.','...KEYYEK...',
    '..KYSSYYSK..','..KYSSYYSK..','..KYYSSYYK..','...KYYYYK...',
    '....KKKK....','.....KK.....'
  ], WASP_PAL),
  sprite([
    '............','.WW......WW.','.WWWKKKKWWW.','...KEYYEK...',
    '..KYSSYYSK..','..KYSSYYSK..','..KYYSSYYK..','...KYYYYK...',
    '....KKKK....','.....KK.....'
  ], WASP_PAL)
];

/* ---------- монета: 8x8, чотири кадри обертання ---------- */
const COIN_PAL = { K:'#8A5410', Y:'#FFD23F', O:'#E09A19', W:'#FFF6C8' };
const COIN = [
  sprite(['..KKKK..','.KYWWYK.','KYWYYOYK','KYWYYOYK','KYWYYOYK','KYWYYOYK','.KYOOYK.','..KKKK..'], COIN_PAL),
  sprite(['...KK...','..KYYK..','..KWYK..','..KWYK..','..KWYK..','..KWYK..','..KYYK..','...KK...'], COIN_PAL),
  sprite(['...KK...','...KK...','...WK...','...WK...','...WK...','...WK...','...KK...','...KK...'], COIN_PAL),
  sprite(['...KK...','..KYYK..','..KYWK..','..KYWK..','..KYWK..','..KYWK..','..KYYK..','...KK...'], COIN_PAL)
];

/* ---------- серце HUD: 9x8 ---------- */
const HEART_PAL = { K:'#2A1B3D', R:'#F0577A', r:'#B62D50', W:'#FFC2D2' };
const HEART_ROWS = [
  '.KK.KK...','KWWKRRK..','KWRRRRRK.','KRRRRRRK.','.KRRRRK..','..KRRK...','...KK....','.........'
];
const HEART = sprite(HEART_ROWS, HEART_PAL);
const HEART_OFF = sprite(HEART_ROWS.map(r => r.replace(/[RrW]/g, 'd')), { K:'#3A2A5A', d:'#241640' });

/* ---------- рівень: 1 земля, 2 кам'яна платформа, 3 шипи ---------- */
const grid = new Uint8Array(COLS * ROWS);
const at = (x, y) => (x < 0 || x >= COLS || y < 0 || y >= ROWS) ? 0 : grid[y * COLS + x];
const solid = (x, y) => { const t = at(x, y); return t === 1 || t === 2; };
function rect(x, y, w, h, t){
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++){
    const gx = x + i, gy = y + j;
    if (gx >= 0 && gx < COLS && gy >= 0 && gy < ROWS) grid[gy * COLS + gx] = t;
  }
}
const seg = (x, w, top) => rect(x, top, w, ROWS - top, 1);
const plat = (x, y, w) => rect(x, y, w, 1, 2);
const spikes = (x, y, w) => rect(x, y, w, 1, 3);

seg(0, 27, 13);  seg(30, 23, 13); seg(56, 6, 12);  seg(65, 10, 11);
seg(75, 14, 13); seg(89, 20, 13); seg(112, 6, 12); seg(118, 6, 11);
seg(124, 6, 10); seg(133, 28, 13); seg(164, 4, 13); seg(181, 27, 13);
plat(13, 10, 3);  plat(20, 9, 3);   plat(34, 9, 4);   plat(44, 10, 3);
plat(58, 9, 2);   plat(68, 8, 3);   plat(80, 10, 4);  plat(92, 10, 3);
plat(99, 9, 3);   plat(106, 10, 3); plat(137, 9, 4);  plat(145, 8, 3);
plat(152, 10, 4); plat(169, 11, 2); plat(173, 10, 2); plat(177, 11, 2);
plat(186, 10, 3); plat(191, 9, 3);
spikes(40, 12, 2); spikes(48, 12, 1); spikes(101, 12, 2);
spikes(140, 12, 2); spikes(155, 12, 1); spikes(184, 12, 2);

const FLAG_X = 203 * TILE, FLAG_BASE = 13 * TILE;
const START = { x: 2 * TILE, y: 11 * TILE };
</script>

<script>
"use strict";
/* ---------- сутності рівня ---------- */
const coins = [], enemies = [], sparks = [];
function coinAt(tx, ty){
  if (solid(tx, ty)) return;
  coins.push({ x: tx * TILE + 4, y: ty * TILE + 4, got: false, bob: (tx * 7 + ty * 3) % 60 });
}
const coinRow = (x, y, n) => { for (let i = 0; i < n; i++) coinAt(x + i, y); };
const coinArc = (x, y, n) => {
  for (let i = 0; i < n; i++){
    coinAt(x + i, y - Math.round(Math.sin((i + 0.5) / n * Math.PI) * 2.2));
  }
};
coinRow(6, 11, 5);   coinRow(13, 9, 3);   coinRow(20, 8, 3);   coinArc(26, 11, 5);
coinRow(34, 8, 4);   coinArc(39, 11, 4);  coinRow(44, 9, 3);   coinArc(52, 11, 5);
coinRow(58, 8, 2);   coinArc(61, 10, 5);  coinRow(68, 7, 3);   coinRow(71, 10, 3);
coinRow(80, 9, 4);   coinRow(90, 12, 4);  coinRow(92, 9, 3);   coinRow(99, 8, 3);
coinRow(106, 9, 3);  coinArc(108, 11, 5); coinRow(113, 11, 4); coinRow(119, 10, 4);
coinRow(125, 9, 4);  coinArc(129, 9, 5);  coinRow(137, 8, 4);  coinRow(145, 7, 3);
coinRow(149, 12, 4); coinRow(152, 9, 4);  coinRow(157, 12, 3); coinArc(160, 11, 5);
coinRow(169, 10, 2); coinRow(173, 9, 2);  coinRow(177, 10, 2);
coinRow(182, 12, 4); coinRow(186, 9, 3);  coinRow(191, 8, 3);  coinRow(196, 12, 5);
const TOTAL_COINS = coins.length;

const BUG_SPEC  = [[18,14,25],[46,43,51],[70,66,73],[84,77,87],[95,91,99],
                   [127,125,129],[148,144,152],[158,156,160],[190,187,194],[200,197,204]];
const WASP_SPEC = [[63,9],[110,9],[131,8],[143,6],[171,8],[175,8]];
function resetEntities(){
  coins.forEach(c => c.got = false);
  enemies.length = 0; sparks.length = 0;
  for (const [tx, lo, hi] of BUG_SPEC){
    enemies.push({ kind:'bug', x:tx*TILE+1, y:0, w:12, h:9, vx:0.5, dead:0,
                   lo:lo*TILE, hi:hi*TILE + TILE - 12, vy:0 });
  }
  for (const [tx, ty] of WASP_SPEC){
    enemies.push({ kind:'wasp', ax:tx*TILE+2, ay:ty*TILE, x:tx*TILE+2, y:ty*TILE,
                   w:10, h:8, t:tx*11, dead:0 });
  }
  for (const e of enemies){
    if (e.kind !== 'bug') continue;
    let ty = 0;
    while (ty < ROWS && !solid(Math.floor((e.x + 6) / TILE), ty)) ty++;
    e.y = ty * TILE - e.h;
  }
}

/* ---------- стан гри ---------- */
const player = { x:START.x, y:START.y, vx:0, vy:0, w:10, h:18, dir:1,
                 grounded:false, coyote:0, buffer:0, anim:0, squash:0,
                 iframes:0, autoJump:0 };
let lives, score, got, camX, camY, shake, state, tick, safe, flagRaise;

function camClampY(v){
  if (VH >= WORLD_H) return (WORLD_H - VH) / 2;
  return Math.max(0, Math.min(v, WORLD_H - VH));
}
function resetLevel(fullReset){
  if (fullReset){ lives = 3; score = 0; got = 0; }
  resetEntities();
  player.x = START.x; player.y = START.y; player.vx = 0; player.vy = 0;
  player.dir = 1; player.iframes = 0; player.squash = 0; player.autoJump = 0;
  camX = 0; camY = camClampY(WORLD_H); shake = 0; tick = 0; flagRaise = 0;
  safe = { x: START.x, y: START.y };
}

/* ---------- звук ---------- */
let actx = null, muted = false;
function audio(){
  if (!actx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) actx = new AC();
  }
  if (actx && actx.state === 'suspended') actx.resume();
}
function beep(freq, dur, type, vol, to){
  if (muted || !actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t);
  if (to) o.frequency.exponentialRampToValueAtTime(Math.max(50, to), t + dur);
  g.gain.setValueAtTime(vol || 0.05, t);
  g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
const SFX = {
  jump:  () => beep(330, 0.14, 'square', 0.05, 620),
  coin:  () => { beep(1050, 0.06, 'square', 0.04); setTimeout(() => beep(1560, 0.09, 'square', 0.04), 55); },
  stomp: () => beep(220, 0.12, 'square', 0.06, 90),
  hurt:  () => beep(300, 0.32, 'sawtooth', 0.05, 70),
  win:   () => [0, 1, 2, 3].forEach(i => setTimeout(() => beep([523,659,784,1046][i], 0.16, 'square', 0.05), i * 130)),
  over:  () => [0, 1, 2].forEach(i => setTimeout(() => beep([392,311,196][i], 0.3, 'triangle', 0.06), i * 190))
};

/* ---------- полотно ---------- */
const cvs = document.getElementById('screen');
const ctx = cvs.getContext('2d');
ctx.imageSmoothingEnabled = false;

/* ---------- керування: клавіатура ---------- */
const keys = { left:false, right:false, jump:false };
const KEYMAP = {
  ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right',
  Space:'jump', ArrowUp:'jump', KeyW:'jump'
};
addEventListener('keydown', e => {
  if (e.code === 'KeyP' || e.code === 'Escape'){ togglePause(); e.preventDefault(); return; }
  if (e.code === 'KeyF'){ toggleFull(); e.preventDefault(); return; }
  if (e.code === 'Enter' && state !== 'play'){ primary(); e.preventDefault(); return; }
  const k = KEYMAP[e.code];
  if (!k) return;
  e.preventDefault();
  if (k === 'jump'){
    if (state !== 'play'){ primary(); return; }
    if (!keys.jump) player.buffer = 7;
  }
  keys[k] = true;
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });
addEventListener('blur', () => {
  keys.left = keys.right = keys.jump = false;
  touch.clear();
  if (state === 'play') setState('pause');
});

/* ---------- керування: жести (без екранних кнопок) ----------
   Ліва половина екрана — вести пальцем ліворуч/праворуч.
   Права половина — торкнутися, щоб стрибнути; тримати — стрибок вищий.
   Свайп угору будь-де — теж стрибок, щоб можна було грати однією рукою. */
const touch = new Map();
let hintFade = 0;                       /* підказка про зони на початку гри */
const DEAD = 9, DRAG = 44, SWIPE = 30;

function artPoint(e){
  const r = cvs.getBoundingClientRect();
  return { x: (e.clientX - r.left) / SCALE, y: (e.clientY - r.top) / SCALE };
}
function doJump(){
  player.buffer = 7;
  keys.jump = true;
  player.autoJump = 13;                 /* тримаємо «кнопку» — стрибок на всю висоту */
}
function pointerDown(e){
  if (e.pointerType === 'mouse' || state !== 'play') return;
  if (e.target && e.target.closest && e.target.closest('#chips, #overlay')) return;
  e.preventDefault();
  const half = innerWidth / 2;
  if (e.clientX < half){
    touch.set(e.pointerId, { role:'move', ox:e.clientX, oy:e.clientY, x:e.clientX, y:e.clientY });
  } else {
    touch.set(e.pointerId, { role:'jump', ox:e.clientX, oy:e.clientY, x:e.clientX, y:e.clientY });
    doJump();
    player.autoJump = 0;                /* тут висоту тримає сам палець */
    const p = artPoint(e);
    sparks.push({ ring:1, x:p.x + camX, y:p.y + camY, life:16, c:'#FFF3DA' });
  }
}
function pointerMove(e){
  const t = touch.get(e.pointerId);
  if (!t) return;
  t.x = e.clientX; t.y = e.clientY;
  if (t.oy - t.y > SWIPE){              /* свайп угору = стрибок */
    doJump();
    t.oy = t.y;
  }
  if (t.role !== 'move') return;
  const dx = t.x - t.ox;
  if (dx > DRAG) t.ox = t.x - DRAG;
  if (dx < -DRAG) t.ox = t.x + DRAG;
  keys.right = dx > DEAD;
  keys.left  = dx < -DEAD;
}
function pointerUp(e){
  const t = touch.get(e.pointerId);
  if (!t) return;
  touch.delete(e.pointerId);
  if (t.role === 'move'){ keys.left = keys.right = false; }
  else { keys.jump = false; player.autoJump = 0; }
}
addEventListener('pointerdown', pointerDown, { passive:false });
addEventListener('pointermove', pointerMove, { passive:false });
addEventListener('pointerup', pointerUp);
addEventListener('pointercancel', pointerUp);
addEventListener('contextmenu', e => { if (state === 'play') e.preventDefault(); });
</script>

<script>
"use strict";
/* ---------- фізика ---------- */
const GRAV = 0.55, MAXFALL = 8, ACC = 0.38, AIR_ACC = 0.24,
      FRIC = 0.62, MAXSPD = 2.1, JUMP_V = 7.6, STOMP_V = 5.4;

function tilesAround(x, y, w, h){
  return { x0: Math.floor(x / TILE), x1: Math.floor((x + w - 1) / TILE),
           y0: Math.floor(y / TILE), y1: Math.floor((y + h - 1) / TILE) };
}
function moveX(o, dx){
  o.x += dx;
  const t = tilesAround(o.x, o.y, o.w, o.h);
  for (let ty = t.y0; ty <= t.y1; ty++){
    if (dx > 0 && solid(t.x1, ty)){ o.x = t.x1 * TILE - o.w; o.vx = 0; return true; }
    if (dx < 0 && solid(t.x0, ty)){ o.x = (t.x0 + 1) * TILE; o.vx = 0; return true; }
  }
  if (o.x < 0){ o.x = 0; o.vx = 0; return true; }
  return false;
}
function moveY(o, dy){
  o.y += dy;
  const t = tilesAround(o.x, o.y, o.w, o.h);
  for (let tx = t.x0; tx <= t.x1; tx++){
    if (dy > 0 && solid(tx, t.y1)){ o.y = t.y1 * TILE - o.h; o.vy = 0; return 1; }
    if (dy < 0 && solid(tx, t.y0)){ o.y = (t.y0 + 1) * TILE; o.vy = 0; return -1; }
  }
  return 0;
}
function overlaps(a, b){
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function puff(x, y, n, color, spd){
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2;
    sparks.push({ x, y, vx: Math.cos(a) * spd * (0.4 + Math.random()),
                  vy: Math.sin(a) * spd * (0.4 + Math.random()) - 0.6,
                  life: 18 + Math.random() * 14, c: color });
  }
}
/* пилюка з-під ніг: низька, симетрична, без розльоту вгору */
function dust(x, y, n, color){
  for (let i = 0; i < n; i++){
    const side = i % 2 ? 1 : -1;
    sparks.push({ x: x + side * (2 + Math.random() * 3), y: y - 1,
                  vx: side * (0.25 + Math.random() * 0.35), vy: -0.25 - Math.random() * 0.2,
                  life: 9 + Math.random() * 5, c: color });
  }
}

function hurt(){
  if (player.iframes > 0 || state !== 'play') return;
  lives--;
  player.iframes = 100;
  shake = 7;
  SFX.hurt();
  puff(player.x + 5, player.y + 9, 10, '#F0577A', 1.7);
  if (lives <= 0){ setState('over'); SFX.over(); return; }
  player.vx = -player.dir * 1.6;
  player.vy = -4.2;
}
function respawn(){
  player.x = safe.x; player.y = safe.y;
  player.vx = 0; player.vy = 0;
  camX = Math.max(0, Math.min(player.x - VW / 2, WORLD_W - VW));
}

function updatePlayer(){
  if (player.autoJump > 0 && --player.autoJump === 0) keys.jump = false;

  const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  const acc = player.grounded ? ACC : AIR_ACC;
  if (dir){ player.vx += dir * acc; player.dir = dir; }
  else if (player.grounded) player.vx *= FRIC;
  else player.vx *= 0.96;
  player.vx = Math.max(-MAXSPD, Math.min(MAXSPD, player.vx));
  if (Math.abs(player.vx) < 0.04) player.vx = 0;

  if (player.buffer > 0) player.buffer--;
  if (player.coyote > 0) player.coyote--;
  if (player.buffer > 0 && player.coyote > 0){
    player.vy = -JUMP_V; player.buffer = 0; player.coyote = 0;
    player.grounded = false; player.squash = -6; SFX.jump();
    dust(player.x + 5, player.y + player.h, 2, '#E8DCC0');
  }
  if (!keys.jump && player.vy < -3) player.vy = -3;   /* висота за тривалістю */

  player.vy = Math.min(player.vy + GRAV, MAXFALL);
  moveX(player, player.vx);
  const hit = moveY(player, player.vy);
  if (hit === 1){
    if (!player.grounded){ player.squash = 5; dust(player.x + 5, player.y + player.h, 2, '#C9A26B'); }
    player.grounded = true; player.coyote = 7;
  } else {
    if (player.grounded) player.coyote = 7;
    player.grounded = false;
  }

  const t = tilesAround(player.x + 1, player.y + 6, player.w - 2, player.h - 6);
  for (let ty = t.y0; ty <= t.y1; ty++)
    for (let tx = t.x0; tx <= t.x1; tx++)
      if (at(tx, ty) === 3){ hurt(); if (lives > 0) respawn(); return; }

  if (player.y > WORLD_H + 20){ hurt(); if (lives > 0) respawn(); return; }

  if (player.grounded && tick % 12 === 0){
    const fx = Math.floor((player.x + player.w / 2) / TILE);
    const fy = Math.floor((player.y + player.h) / TILE);
    let ok = at(fx, fy) === 1 || at(fx, fy) === 2;
    for (let dx = -1; dx <= 1; dx++) if (at(fx + dx, fy - 1) === 3) ok = false;
    if (ok){ safe.x = fx * TILE + 3; safe.y = fy * TILE - player.h - 1; }
  }

  if (player.iframes > 0) player.iframes--;
  if (player.squash > 0) player.squash--;
  if (player.squash < 0) player.squash++;

  /* цикл бігу: крок — пауза — крок — пауза */
  if (player.grounded && Math.abs(player.vx) > 0.2) player.anim += Math.abs(player.vx) * 0.135;
  else player.anim = 0;
}

function updateEnemies(){
  for (const e of enemies){
    if (e.dead){ e.dead--; e.y += 1.4; continue; }
    if (e.kind === 'bug'){
      e.x += e.vx;
      const ahead = Math.floor((e.x + (e.vx > 0 ? e.w + 1 : -1)) / TILE);
      const foot = Math.floor((e.y + e.h + 2) / TILE);
      const head = Math.floor((e.y + e.h / 2) / TILE);
      if (e.x < e.lo || e.x > e.hi || solid(ahead, head) || !solid(ahead, foot)){
        e.vx *= -1;
        e.x = Math.max(e.lo, Math.min(e.hi, e.x));
      }
    } else {
      e.t += 1;
      e.x = e.ax + Math.sin(e.t * 0.017) * 26;
      e.y = e.ay + Math.sin(e.t * 0.045) * 9;
    }
    if (player.iframes > 0) continue;
    if (!overlaps(player, e)) continue;
    const stomping = player.vy > 0.6 && (player.y + player.h) - e.y < 11;
    if (stomping){
      e.dead = 26;
      score += 50;
      player.vy = -STOMP_V;
      player.buffer = 0; player.squash = 4;
      SFX.stomp();
      puff(e.x + e.w / 2, e.y + 3, 8, e.kind === 'bug' ? '#E4573D' : '#FFC93C', 1.5);
    } else hurt();
  }
}

function updateCoins(){
  for (const c of coins){
    if (c.got) continue;
    c.bob++;
    if (player.x < c.x + 8 && player.x + player.w > c.x &&
        player.y < c.y + 8 && player.y + player.h > c.y){
      c.got = true; got++; score += 10; SFX.coin();
      puff(c.x + 4, c.y + 4, 5, '#FFD23F', 1.2);
    }
  }
}

function updateSparks(){
  for (let i = sparks.length - 1; i >= 0; i--){
    const s = sparks[i];
    if (!s.ring){ s.x += s.vx; s.y += s.vy; s.vy += 0.09; }
    s.life--;
    if (s.life <= 0) sparks.splice(i, 1);
  }
}

function update(){
  tick++;
  if (hintFade > 0) hintFade--;
  updatePlayer();
  if (state !== 'play') return;
  updateEnemies();
  updateCoins();
  updateSparks();
  if (shake > 0) shake -= 0.5;

  if (player.x + player.w > FLAG_X + 2){
    score += lives * 200;
    setState('win'); SFX.win();
  }

  const tx = Math.max(0, Math.min(player.x + player.w / 2 - VW / 2 + player.dir * 26, WORLD_W - VW));
  const ty = camClampY(player.y + player.h / 2 - VH / 2 + 16);
  camX += (tx - camX) * 0.11;
  camY += (ty - camY) * 0.08;
}
</script>

<script>
"use strict";
/* ---------- малювання ---------- */
const SKY = ['#3FB8F0','#55C4F4','#6ECFF7','#88DAF9','#A2E3FA','#BDEBFB','#D6F2FC','#E9F8FD'];
const hash = (x, y) => { let h = (x * 73856093) ^ (y * 19349663); h = (h ^ (h >>> 13)) >>> 0; return h; };

function drawText(s, x, y, color, align){
  ctx.font = '8px "Press Start 2P", monospace';
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'top';
  ctx.fillStyle = '#1B1030';                 /* контур, щоб читалось на будь-якому небі */
  for (const [dx, dy] of [[-1,0],[1,0],[0,-1],[0,1],[1,1]]) ctx.fillText(s, x + dx, y + dy);
  ctx.fillStyle = color;
  ctx.fillText(s, x, y);
}

let skyCanvas = null;
function buildSky(){
  const c = document.createElement('canvas');
  c.width = VW; c.height = VH;
  const g = c.getContext('2d');
  const n = SKY.length, band = Math.ceil(VH / n);
  for (let i = 0; i < n; i++){ g.fillStyle = SKY[i]; g.fillRect(0, i * band, VW, band); }
  /* три ряди дизерингу між смугами — перехід без «лінійки» */
  for (let i = 0; i < n - 1; i++){
    const y = (i + 1) * band;
    g.fillStyle = SKY[i + 1];
    for (let x = 0; x < VW; x++){
      if ((x + i) % 4 === 0) g.fillRect(x, y - 3, 1, 1);
      if ((x + i) % 2 === 0) g.fillRect(x, y - 2, 1, 1);
      if ((x + i) % 4 !== 1) g.fillRect(x, y - 1, 1, 1);
    }
  }
  /* сонце — по центру вгорі, щоб не лізло під HUD у кутах */
  const sx = Math.round(VW * 0.5), sy = Math.round(VH * 0.13);
  g.fillStyle = '#FFE58A';
  g.fillRect(sx - 12, sy - 6, 24, 12); g.fillRect(sx - 6, sy - 12, 12, 24);
  g.fillRect(sx - 10, sy - 10, 20, 20);
  g.fillStyle = '#FFF7CF';
  g.fillRect(sx - 8, sy - 4, 16, 8); g.fillRect(sx - 4, sy - 8, 8, 16);
  skyCanvas = c;
}
function drawSky(){
  if (!skyCanvas || skyCanvas.width !== VW || skyCanvas.height !== VH) buildSky();
  ctx.drawImage(skyCanvas, 0, 0);
}

/* пагорби стоять рівно на лінії землі: над нею — смуга пагорбів,
   під нею їх немає, тож у прірві видно небо, а не зелену стіну */
function drawHills(par, offset, amp, wave, col, col2){
  const off = camX * par, gline = 13 * TILE - camY;
  if (gline <= 0) return;
  const ybase = gline - offset;
  for (let x = 0; x < VW; x++){
    const wx = x + off;
    const h = Math.round((Math.sin(wx / wave) * 0.6 + Math.sin(wx / (wave * 0.37)) * 0.4) * amp / 2) * 2;
    const top = Math.round(ybase - h);
    if (top >= gline) continue;
    ctx.fillStyle = col2; ctx.fillRect(x, top, 1, 3);
    ctx.fillStyle = col;  ctx.fillRect(x, top + 3, 1, gline - top - 3);
  }
}

function drawClouds(){
  const par = 0.3, span = VW + 120;
  for (let i = 0; i < 12; i++){
    const wx = i * 380 + 60, wy = 14 + ((i * 37) % 46) - camY * 0.18;
    let x = Math.round(wx - camX * par) % span;
    if (x < -120) x += span;
    const w = 20 + (i % 3) * 10;
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(x, wy, w, 7); ctx.fillRect(x + 5, wy - 5, w - 12, 6);
    ctx.fillRect(x + 12, wy - 8, 10, 6);
    ctx.fillStyle = '#D5EEFB';
    ctx.fillRect(x, wy + 5, w, 2);
  }
}

function drawTree(sx, gy, kind){
  const trunkH = kind ? 22 : 16;
  ctx.fillStyle = '#6B4423'; ctx.fillRect(sx + 8, gy - trunkH, 5, trunkH);
  ctx.fillStyle = '#4E3018'; ctx.fillRect(sx + 8, gy - trunkH, 2, trunkH);
  const cy = gy - trunkH - (kind ? 20 : 15);
  const rows = kind ? [8,14,20,22,22,20,14,8] : [6,12,16,18,16,12,6];
  for (let i = 0; i < rows.length; i++){
    const w = rows[i], x = sx + 10 - w / 2;
    ctx.fillStyle = i < 2 ? '#6FD97F' : (i > rows.length - 3 ? '#2F8C4C' : '#48B662');
    ctx.fillRect(Math.round(x), cy + i * 4, w, 4);
  }
}
function drawDecor(){
  const par = 0.72, span = 137;
  const gy = Math.round(13 * TILE - camY) + 2;
  const first = Math.floor(camX * par / span) - 1;
  for (let i = first; i < first + Math.ceil(VW / span) + 3; i++){
    const sx = Math.round(i * span + 40 - camX * par);
    if (sx < -40 || sx > VW + 10) continue;
    drawTree(sx, gy, ((i % 3) + 3) % 3 === 0 ? 1 : 0);
  }
}

function drawTile(t, sx, sy, tx, ty){
  if (t === 1){
    const h = hash(tx, ty);
    ctx.fillStyle = '#B0763F'; ctx.fillRect(sx, sy, TILE, TILE);
    ctx.fillStyle = '#96612F';
    ctx.fillRect(sx + (h % 11), sy + 4 + (h >> 3) % 9, 3, 2);
    ctx.fillRect(sx + 2 + (h >> 7) % 10, sy + 2 + (h >> 11) % 12, 2, 2);
    ctx.fillStyle = '#C99062';
    ctx.fillRect(sx + 4 + (h >> 5) % 8, sy + 6 + (h >> 9) % 8, 2, 1);
    if (!solid(tx, ty - 1)){
      ctx.fillStyle = '#5FD06A'; ctx.fillRect(sx, sy, TILE, 5);
      ctx.fillStyle = '#3FA855'; ctx.fillRect(sx, sy + 5, TILE, 2);
      ctx.fillStyle = '#7BE688';
      ctx.fillRect(sx + (h % 12), sy, 2, 2); ctx.fillRect(sx + 2 + (h >> 4) % 11, sy + 1, 1, 2);
      ctx.fillStyle = '#2E7C40'; ctx.fillRect(sx, sy + 7, TILE, 1);
    }
    if (!solid(tx - 1, ty)){ ctx.fillStyle = '#8A5A2E'; ctx.fillRect(sx, sy, 2, TILE); }
    if (!solid(tx + 1, ty)){ ctx.fillStyle = '#8A5A2E'; ctx.fillRect(sx + TILE - 2, sy, 2, TILE); }
  } else if (t === 2){
    ctx.fillStyle = '#5B4326'; ctx.fillRect(sx, sy, TILE, TILE);
    ctx.fillStyle = '#D9C08A'; ctx.fillRect(sx + 1, sy + 1, TILE - 2, TILE - 2);
    ctx.fillStyle = '#F4E5BB'; ctx.fillRect(sx + 1, sy + 1, TILE - 2, 3);
    ctx.fillStyle = '#A8895A'; ctx.fillRect(sx + 1, sy + TILE - 4, TILE - 2, 3);
    ctx.fillStyle = '#B99E6B'; ctx.fillRect(sx + 7, sy + 5, 2, 6);
  } else if (t === 3){
    for (let i = 0; i < 4; i++){
      const bx = sx + i * 4;
      for (let r = 0; r < 8; r++){
        const w = Math.min(4, 1 + Math.floor(r / 2));
        ctx.fillStyle = r < 3 ? '#F2F8FF' : '#C6D6E8';
        ctx.fillRect(bx + 2 - Math.floor(w / 2), sy + 8 + r, w, 1);
      }
      ctx.fillStyle = '#5C6E86'; ctx.fillRect(bx, sy + 15, 4, 1);
    }
  }
}

/* глибина під світом, коли екран вищий за рівень */
function drawUnderground(oy){
  const top = WORLD_H - oy;
  if (top >= VH) return;
  ctx.fillStyle = '#7A4E24'; ctx.fillRect(0, top, VW, VH - top);
  ctx.fillStyle = '#633D1B';
  for (let y = top; y < VH; y += 6)
    for (let x = (y % 12); x < VW; x += 13) ctx.fillRect(x, y, 3, 2);
}

function drawFlag(ox, oy){
  const x = FLAG_X - ox, base = FLAG_BASE - oy;
  if (x < -40 || x > VW + 40) return;
  ctx.fillStyle = '#3B2E5A'; ctx.fillRect(x + 4, base - 56, 4, 56);
  ctx.fillStyle = '#CFC5E6'; ctx.fillRect(x + 5, base - 56, 2, 56);
  ctx.fillStyle = '#FFD23F'; ctx.fillRect(x + 3, base - 60, 6, 5);
  ctx.fillStyle = '#2A1B3D'; ctx.fillRect(x + 2, base - 3, 8, 3);
  const rise = state === 'win' ? Math.min(18, flagRaise * 0.5) : 0;
  const top = base - 54 - rise;
  for (let r = 0; r < 12; r++){
    const w = 16 - Math.abs(r - 6);
    ctx.fillStyle = (r >> 1) % 2 ? '#2AB7E6' : '#FFF3DA';
    ctx.fillRect(x + 8, top + r, w, 1);
  }
}

function drawPlayer(ox, oy){
  if (player.iframes > 0 && Math.floor(player.iframes / 4) % 2) return;
  let pose;
  if (!player.grounded) pose = player.vy < 0 ? 'jump' : 'stand';
  else if (Math.abs(player.vx) > 0.2) pose = RUN_CYCLE[Math.floor(player.anim) % RUN_CYCLE.length];
  else pose = 'stand';
  const img = FROG[pose + (player.dir > 0 ? 'R' : 'L')];
  let sw = 16, sh = 20;
  if (player.squash > 0){ sw = 18; sh = 18; }
  else if (player.squash < 0){ sw = 14; sh = 22; }
  const dx = Math.round(player.x - 3 - ox - (sw - 16) / 2);
  const dy = Math.round(player.y - 2 - oy + (20 - sh));
  ctx.drawImage(img, dx, dy, sw, sh);
}

function ring(cx, cy, r, color){
  ctx.fillStyle = color;
  for (let a = 0; a < 16; a++){
    const t = a / 16 * Math.PI * 2;
    ctx.fillRect(Math.round(cx + Math.cos(t) * r), Math.round(cy + Math.sin(t) * r), 1, 1);
  }
}
/* пальці на екрані: кільце в точці дотику й крапка там, де палець зараз */
function drawTouchGuides(){
  if (!touch.size) return;
  const r = cvs.getBoundingClientRect();
  for (const t of touch.values()){
    if (t.role !== 'move') continue;
    const ox = (t.ox - r.left) / SCALE, oy = (t.oy - r.top) / SCALE;
    const px = (t.x - r.left) / SCALE, py = (t.y - r.top) / SCALE;
    ring(ox, oy, 11, 'rgba(255,243,218,.5)');
    ctx.fillStyle = 'rgba(255,201,60,.85)';
    ctx.fillRect(Math.round(px) - 2, Math.round(py) - 2, 4, 4);
  }
}

/* HUD тримається лівого кута: правий верх віддано кнопкам звуку й екрана */
function drawHUD(){
  for (let i = 0; i < 3; i++)
    ctx.drawImage(i < lives ? HEART : HEART_OFF, 5 + i * 11, 4);
  ctx.drawImage(COIN[0], 42, 4);
  drawText(got + '/' + TOTAL_COINS, 54, 5, '#FFF3DA');
  drawText(String(score).padStart(5, '0'), 5, 17, '#FFC93C');
}

function render(){
  const shx = shake > 0 ? Math.round((Math.random() - 0.5) * shake) : 0;
  const shy = shake > 0 ? Math.round((Math.random() - 0.5) * shake) : 0;
  const ox = Math.round(camX) + shx, oy = Math.round(camY) + shy;

  drawSky();
  drawClouds();
  const gline = Math.max(0, Math.min(VH, 13 * TILE - oy));
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, VW, gline); ctx.clip();
  drawHills(0.16, 6, 26, 90, '#8FD9AE', '#B4EBC8');
  drawHills(0.32, 2, 20, 58, '#63C089', '#8AD9A6');
  drawDecor();
  ctx.restore();
  drawUnderground(oy);

  const tx0 = Math.max(0, Math.floor(ox / TILE)), tx1 = Math.min(COLS - 1, tx0 + Math.ceil(VW / TILE) + 1);
  const ty0 = Math.max(0, Math.floor(oy / TILE)), ty1 = Math.min(ROWS - 1, ty0 + Math.ceil(VH / TILE) + 1);
  for (let ty = ty0; ty <= ty1; ty++)
    for (let tx = tx0; tx <= tx1; tx++){
      const t = at(tx, ty);
      if (t) drawTile(t, tx * TILE - ox, ty * TILE - oy, tx, ty);
    }

  drawFlag(ox, oy);

  for (const c of coins){
    if (c.got) continue;
    const x = c.x - ox;
    if (x < -10 || x > VW + 10) continue;
    const bob = Math.round(Math.sin(c.bob * 0.08) * 1.5);
    ctx.drawImage(COIN[Math.floor((tick + c.bob) / 7) % 4], Math.round(x), Math.round(c.y - oy + bob));
  }

  for (const e of enemies){
    const x = Math.round(e.x - ox - 1);
    if (x < -20 || x > VW + 20) continue;
    const y = Math.round(e.y - oy - 1);
    if (e.dead){
      ctx.globalAlpha = Math.max(0, e.dead / 26);
      ctx.drawImage(e.kind === 'bug' ? BUG : WASP[0], x, y, e.kind === 'bug' ? 14 : 12, 4);
      ctx.globalAlpha = 1;
      continue;
    }
    ctx.drawImage(e.kind === 'bug' ? BUG : WASP[Math.floor(tick / 4) % 2], x, y);
  }

  drawPlayer(ox, oy);

  for (const s of sparks){
    ctx.globalAlpha = Math.min(1, s.life / 12);
    if (s.ring) ring(s.x - ox, s.y - oy, 18 - s.life, s.c);
    else { ctx.fillStyle = s.c; ctx.fillRect(Math.round(s.x - ox), Math.round(s.y - oy), 2, 2); }
  }
  ctx.globalAlpha = 1;

  drawTouchGuides();
  drawHUD();
}
</script>

<script>
"use strict";
/* ---------- екрани, повний екран, головний цикл ---------- */
const overlay = document.getElementById('overlay');
const chips = document.getElementById('chips');
const hint = document.getElementById('hint');
const COARSE = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;

const LEGEND = COARSE ? `
  <div class="legend">
    <div class="row"><span class="what">Бігти</span>
      <span class="how">ЛІВА ПОЛОВИНА —<br>ВЕСТИ ПАЛЬЦЕМ</span></div>
    <div class="row"><span class="what">Стрибати</span>
      <span class="how">ПРАВА ПОЛОВИНА —<br>ТОРКНУТИСЬ, ТРИМАТИ = ВИЩЕ</span></div>
    <div class="row"><span class="what">Однією рукою</span>
      <span class="how">СВАЙП УГОРУ =<br>СТРИБОК</span></div>
  </div>` : `
  <div class="legend">
    <div class="row"><span class="what">Бігти</span>
      <span class="how"><kbd>A</kbd> <kbd>D</kbd> АБО СТРІЛКИ</span></div>
    <div class="row"><span class="what">Стрибати</span>
      <span class="how"><kbd>SPACE</kbd> ТРИМАТИ = ВИЩЕ</span></div>
    <div class="row"><span class="what">Пауза · екран</span>
      <span class="how"><kbd>P</kbd> <kbd>F</kbd></span></div>
  </div>`;

const SHEETS = {
  title: () => `<div class="sheet">
      <img class="mascot" id="mascot" alt="">
      <p class="eyebrow">СТАВОКРАЙ · РІВЕНЬ 1</p>
      <h1>Жабік-<em>Стрибун</em></h1>
      <p>Збирай золоті монети, оминай шипи й прірви, стрибай жукам і осам
         на голови — і дійди до прапорця в кінці берега.</p>
      ${LEGEND}
      <p class="rotate">Поверни пристрій горизонтально — берег стане ширшим.</p>
      <button class="go" type="button" id="go">ПОЧАТИ ГРУ</button>
      <footer>${TOTAL_COINS} монет · 3 серця</footer>
    </div>`,
  pause: () => `<div class="sheet">
      <h2>Пауза</h2>
      <p>Жабік перевів дух.</p>
      ${LEGEND}
      <button class="go" type="button" id="go">ПРОДОВЖИТИ</button>
    </div>`,
  over: () => `<div class="sheet">
      <h2>Серця скінчились</h2>
      <p>Жабік присів відпочити. Рівень починається спочатку — цього разу
         обережніше з осами над прірвою.</p>
      <p class="tally">МОНЕТ ${got}/${TOTAL_COINS}<br>ОЧОК ${score}</p>
      <button class="go" type="button" id="go">СПРОБУВАТИ ЗНОВУ</button>
    </div>`,
  win: () => `<div class="sheet">
      <h2>Прапорець твій!</h2>
      <p>${got === TOTAL_COINS ? 'Усі монети до однієї — берег вичищено начисто.'
        : 'Десь на березі лишились монети: спробуй забрати всі.'}</p>
      <p class="tally">МОНЕТ ${got}/${TOTAL_COINS}<br>СЕРДЕЦЬ ${lives}<br>ОЧОК ${score}</p>
      <button class="go" type="button" id="go">ЗІГРАТИ ЩЕ</button>
    </div>`
};

function setState(s){
  state = s;
  if (s === 'play'){
    overlay.hidden = true;
    if (COARSE){ hint.classList.add('on'); setTimeout(() => hint.classList.remove('on'), 3800); }
    return;
  }
  hint.classList.remove('on');
  chips.classList.remove('idle');
  overlay.hidden = false;
  overlay.innerHTML = SHEETS[s]();
  const m = document.getElementById('mascot');
  if (m) m.src = FROG.standR.toDataURL();
  const b = document.getElementById('go');
  b.addEventListener('click', primary);
  b.focus({ preventScroll: true });
}
function primary(){
  audio();
  if (COARSE) tryFull();
  if (state === 'pause') setState('play');
  else { resetLevel(true); setState('play'); }
}
function togglePause(){
  if (state === 'play') setState('pause');
  else if (state === 'pause') setState('play');
}
overlay.addEventListener('pointerdown', e => { if (e.target === overlay) primary(); });

/* ---------- повний екран ---------- */
function tryFull(){
  if (document.fullscreenElement || document.webkitFullscreenElement) return;
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!req) return;
  try {
    const p = req.call(el, { navigationUI: 'hide' });
    if (p && p.then) p.then(lockLandscape, () => {});
    else lockLandscape();
  } catch (err) { /* iOS Safari на телефоні повного екрана не дає */ }
}
function lockLandscape(){
  try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); }
  catch (err) {}
}
function toggleFull(){
  if (document.fullscreenElement || document.webkitFullscreenElement){
    (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document);
  } else tryFull();
}
document.getElementById('full').addEventListener('click', e => { e.preventDefault(); toggleFull(); });
const muteBtn = document.getElementById('mute');
muteBtn.addEventListener('click', () => {
  muted = !muted;
  muteBtn.textContent = muted ? 'ТИША' : 'ЗВУК';
});

/* ---------- розмір: полотно на весь екран цілим кроком ---------- */
function fit(){
  const W = Math.max(240, innerWidth), H = Math.max(180, innerHeight);
  let s = Math.max(1, Math.min(8, Math.round(Math.min(W, H) / 200)));
  const clampW = v => Math.max(168, Math.min(640, v));
  const clampH = v => Math.max(152, Math.min(336, v));
  let vw = clampW(Math.ceil(W / s)), vh = clampH(Math.ceil(H / s));
  while (s > 1 && (vw * s > W + s || vh * s > H + s)){   /* не вилазимо за екран */
    s--; vw = clampW(Math.ceil(W / s)); vh = clampH(Math.ceil(H / s));
  }
  VW = vw; VH = vh; SCALE = s;
  cvs.width = vw; cvs.height = vh;
  cvs.style.width = (vw * s) + 'px';
  cvs.style.height = (vh * s) + 'px';
  ctx.imageSmoothingEnabled = false;
  buildSky();
  document.body.classList.toggle('portrait', H > W * 1.15);
  if (camX !== undefined){
    camX = Math.max(0, Math.min(camX, WORLD_W - VW));
    camY = camClampY(camY);
  }
}
let fitPending = false;
function scheduleFit(){
  if (fitPending) return;
  fitPending = true;
  requestAnimationFrame(() => { fitPending = false; fit(); });
}
addEventListener('resize', scheduleFit);
addEventListener('orientationchange', scheduleFit);
if (window.visualViewport) visualViewport.addEventListener('resize', scheduleFit);
document.addEventListener('fullscreenchange', scheduleFit);

/* чіпи ховаються, коли не заважати */
let idleAt = 0;
function wake(){
  chips.classList.remove('idle');
  idleAt = performance.now() + 3500;
}
addEventListener('pointermove', wake);
addEventListener('keydown', wake);

/* ---------- цикл із фіксованим кроком ---------- */
let last = 0, acc = 0;
const STEP = 1000 / 60;
function frame(now){
  requestAnimationFrame(frame);
  if (!last) last = now;
  acc = Math.min(acc + (now - last), 200);
  last = now;
  while (acc >= STEP){
    acc -= STEP;
    if (state === 'play') update();
    else { tick++; if (state === 'win'){ flagRaise++; updateSparks(); } }
  }
  if (state === 'play' && idleAt && now > idleAt){ chips.classList.add('idle'); idleAt = 0; }
  render();
}

/* мобільний вигляд: без масштабування сторінки, з урахуванням «чубчика» */
(function viewport(){
  let m = document.querySelector('meta[name="viewport"]');
  if (!m){ m = document.createElement('meta'); m.name = 'viewport'; document.head.appendChild(m); }
  m.content = 'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover';
  const th = document.createElement('meta');
  th.name = 'theme-color'; th.content = '#150E27';
  document.head.appendChild(th);
})();

fit();
resetLevel(true);
setState('title');
if (document.fonts && document.fonts.load) document.fonts.load('8px "Press Start 2P"');
requestAnimationFrame(frame);
</script>
